name: Interop Guard

on:
  pull_request:
    paths:
      - software/nanoFramework/CubleyNative.Interop/**
      - firmware/targets-local/CUBLEY_F407_0_5/nanoCLR/cubley_interop.cpp
      - firmware/targets-local/CUBLEY_F407_0_5/nanoCLR/lnbh26_interop.cpp
      - software/nanoFramework/toolchain/interop-checksum.sh
      - software/nanoFramework/toolchain/interop-checksum-fix-test.sh
      - software/nanoFramework/toolchain/interop-guard.sh
      - software/nanoFramework/toolchain/interop-negative-drift-test.sh
      - software/nanoFramework/toolchain/build-CubleyControl.sh
      - software/nanoFramework/toolchain/CubleyControl-deployment-config-test.py
      - software/nanoFramework/toolchain/deploy-CubleyControl.sh
      - software/nanoFramework/CubleyControl/CubleyControl.nfproj
      - software/nanoFramework/CubleyControl/packages.config
      - .vscode/tasks.json
      - docs/software/INTEROP_CONTRACT_V1.md
      - docs/software/INTEROP_VERSIONING_POLICY.md
      - .github/workflows/interop-guard.yml
  push:
    branches:
      - main
    paths:
      - software/nanoFramework/CubleyNative.Interop/**
      - firmware/targets-local/CUBLEY_F407_0_5/nanoCLR/cubley_interop.cpp
      - firmware/targets-local/CUBLEY_F407_0_5/nanoCLR/lnbh26_interop.cpp
      - software/nanoFramework/toolchain/interop-checksum.sh
      - software/nanoFramework/toolchain/interop-checksum-fix-test.sh
      - software/nanoFramework/toolchain/interop-guard.sh
      - software/nanoFramework/toolchain/interop-negative-drift-test.sh
      - software/nanoFramework/toolchain/build-CubleyControl.sh
      - software/nanoFramework/toolchain/CubleyControl-deployment-config-test.py
      - software/nanoFramework/toolchain/deploy-CubleyControl.sh
      - software/nanoFramework/CubleyControl/CubleyControl.nfproj
      - software/nanoFramework/CubleyControl/packages.config
      - .vscode/tasks.json
      - docs/software/INTEROP_CONTRACT_V1.md
      - docs/software/INTEROP_VERSIONING_POLICY.md
      - .github/workflows/interop-guard.yml

jobs:
  interop-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cubley interop mapping
        run: |
          cd software/nanoFramework
          ./toolchain/interop-checksum.sh --check
          ./toolchain/interop-guard.sh

      - name: Verify intentional negative drift fixture blocks
        run: |
          cd software/nanoFramework
          ./toolchain/interop-negative-drift-test.sh

      - name: Verify checksum fix transaction
        run: |
          cd software/nanoFramework
          bash ./toolchain/interop-checksum-fix-test.sh

      - name: Verify managed deployment configuration
        run: |
          python3 software/nanoFramework/toolchain/CubleyControl-deployment-config-test.py
